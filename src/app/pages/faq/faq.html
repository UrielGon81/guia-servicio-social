<section class="faq-section">

  <h1>
    Preguntas Frecuentes
  </h1>

  <mat-accordion>

    <mat-expansion-panel
      *ngFor="let item of preguntas"
    >

      <mat-expansion-panel-header>

        {{ item.pregunta }}

      </mat-expansion-panel-header>

      <p>

        {{ item.respuesta }}

      </p>

    </mat-expansion-panel>

  </mat-accordion>

</section>
