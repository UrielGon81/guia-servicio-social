<section

          'Verificar fechas',
          'Subir documentos necesarios'
        ]

      <h3>
        📋 Registro SICDE

      <p>

          'Carta aceptación',
          'Carta término',

      >

        📄 Formatos Oficiales
      </h3>

      <p>
        Descarga y conoce los documentos necesarios.

    </div>

    <!-- CARD 3 -->

        'Informes Trimestrales',

          'Subir evidencias',
          'Validación del responsable',
          'No exceder fechas límite'

        📊 Informes Trimestrales

      <p>

        [
          'Carta de término',
          'Evaluación final',
          'Liberación',
          'Entrega de certificado'
        ]
      )"
    >

      <img
        src="https://images.unsplash.com/photo-1523240795612-9a054b0db644"
      >

      <h3>
