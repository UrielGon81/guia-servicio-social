<section class="chatbot-page">

  <div class="chat-container">

    <!-- HEADER -->

    <div class="chat-header">

      <h1>
        Asistente Virtual
      </h1>

      <p>
        Sistema de apoyo para servicio social.
      </p>

    </div>

    <!-- CHAT -->

    <div class="chat-box">

      <div
        *ngFor="let mensaje of mensajes"
        class="mensaje"
        [ngClass]="mensaje.tipo"
      >

        {{ mensaje.texto }}

      </div>

      <!-- LOADING -->

      <div
        *ngIf="cargando"
        class="mensaje bot"
      >

        Escribiendo...

      </div>

    </div>

    <!-- INPUT -->

    <div class="chat-input">

      <input

        type="text"

        placeholder="Escribe tu pregunta..."

        [(ngModel)]="pregunta"

        (keyup.enter)="enviarPregunta()"
      >

      <button
        (click)="enviarPregunta()"
      >

        Enviar
        // Icono de enviar (puedes usar un SVG o un ícono de tu biblioteca preferida)

      </button>

    </div>

  </div>

</section>
