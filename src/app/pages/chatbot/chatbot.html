<section class="chatbot-section">

  <div class="chatbot-container">

    <h1>
      🤖 Chatbot Inteligente
    </h1>

    <p class="subtitle">
      Resuelve dudas frecuentes sobre tu servicio social.
    </p>

    <!-- MENSAJES -->

    <div class="chat-messages">

      <div
        *ngFor="let mensaje of mensajes"
        class="mensaje"
        [ngClass]="mensaje.tipo"
      >

        {{ mensaje.texto }}

      </div>

    </div>

    <!-- INPUT -->

    <div class="chat-input">

      <input
        type="text"
        [(ngModel)]="pregunta"
        placeholder="Escribe tu pregunta..."
        (keyup.enter)="enviarPregunta()"
      >

      <button
        type="button"
        (click)="enviarPregunta()"
      >
        Enviar
      </button>

    </div>

  </div>

</section>
